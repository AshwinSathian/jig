name: Publish to npm

# Publishes jig-plan when a GitHub release is published. Authentication is npm
# trusted publishing (OIDC): no npm token is stored, and npm attaches provenance.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - run: npm install -g npm@11
      - name: Release tag matches package.json
        env: { TAG: "${{ github.event.release.tag_name }}" }
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Skip a version already on npm
        id: check
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "jig-plan@$v" version >/dev/null 2>&1; then echo "jig-plan@$v is already published"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: git config --global user.email ci@example.com && git config --global user.name ci && npm test
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
