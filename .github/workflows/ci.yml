name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
      - run: node cli/jig.mjs lint evals/fixtures/plans/good docs/plans
      - run: node cli/jig.mjs lint --no-paths evals/fixtures/plans/produced
      - run: npx --yes eslint@10 .
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
